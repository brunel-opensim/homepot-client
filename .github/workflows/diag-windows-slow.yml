name: Diag Windows Slow Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: isolate test_agent_command_polling on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install --prefer-binary -r backend/requirements.txt
          pip install --prefer-binary -e "backend[agent]"

      - name: Run only test_agent_command_polling
        shell: bash
        timeout-minutes: 18
        env:
          DATABASE__URL: sqlite+aiosqlite:///./test.db
        run: |
          set -o pipefail
          cd backend
          export PYTHONUNBUFFERED=1
          export HOMEPOT_CI_WATCHDOG_SECS=720
          export HOMEPOT_CI_WATCHDOG_LOG=pytest-watchdog.log
          pytest -n 0 tests/test_agent_command_polling.py \
            -m "not slow and not integration and not performance" \
            -o faulthandler_timeout=60 -o faulthandler_exit_on_timeout=true \
            --no-cov --tb=short --durations=0 --verbose \
            -W ignore::UserWarning:homepot \
            -W ignore:".*Database cleanup.*":UserWarning \
            -W ignore:".*Could not cleanup temp database.*":UserWarning \
            > pytest-output.log 2>&1 &
          PYTEST_PID=$!
          LAST_SIZE=0
          STALLS=0
          while kill -0 "$PYTEST_PID" 2>/dev/null; do
            sleep 60
            SIZE=0
            if [[ -f pytest-output.log ]]; then
              SIZE=$(wc -c < pytest-output.log)
            fi
            if [[ "$SIZE" -eq "$LAST_SIZE" ]]; then
              STALLS=$((STALLS + 1))
            else
              STALLS=0
            fi
            LAST_SIZE="$SIZE"
            if [[ "$STALLS" -ge 5 ]]; then
              {
                echo ""
                echo "=== STALLED: pytest output unchanged for 5 minutes; killing ==="
              } >> pytest-output.log
              kill -9 "$PYTEST_PID" 2>/dev/null
              break
            fi
          done
          wait "$PYTEST_PID"
          PYTEST_RC=$?
          if [[ "$STALLS" -ge 5 ]]; then
            echo "--- tail of pytest-output.log ---"
            tail -n 40 pytest-output.log
            PYTEST_RC=1
          fi
          exit "$PYTEST_RC"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-command-polling
          path: |
            backend/pytest-output.log
            backend/pytest-watchdog.log
          if-no-files-found: ignore