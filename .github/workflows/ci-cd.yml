name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Default permissions for all jobs
permissions:
  contents: read

env:
  SECRET_KEY: ci_test_secret_key
  # Ephemeral, throwaway credentials for the CI-only PostgreSQL instance.
  # The database is destroyed with the runner, so this is not a real secret.
  PG_TEST_USER: homepot_user
  PG_TEST_PASSWORD: ci_test_password
  PG_TEST_DB: homepot_test
  # Dedicated scratch database used only for the Alembic migration check.
  PG_TEST_DB_MIG: homepot_mig

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.repository == 'brunel-opensim/homepot-client'
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        set -e
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r backend/requirements.txt
        pip install -e backend/

    - name: Run Black formatter check
      run: black --check backend/src/homepot/ backend/tests/ ai/ uq/ emulators/

    - name: Run isort import sorting check
      run: isort --check-only backend/src/homepot/ backend/tests/ ai/ uq/ emulators/

    - name: Run flake8 linting
      run: flake8 backend/src/homepot/ backend/tests/ ai/ uq/ emulators/

    - name: Run mypy type checking
      run: mypy --config-file=backend/mypy.ini backend/src/homepot/ ai/ uq/ emulators/

    - name: Validate documentation files
      run: |
        # Check that essential documentation files exist
        test -f README.md || (echo "ERROR: README.md missing" && exit 1)
        test -f CONTRIBUTING.md || (echo "ERROR: CONTRIBUTING.md missing" && exit 1)
        test -f docs/index.md || (echo "ERROR: docs/index.md missing" && exit 1)
        test -f docs/getting-started.md || (echo "ERROR: docs/getting-started.md missing" && exit 1)
        echo "Documentation files validated"

  test:
    timeout-minutes: ${{ matrix.timeout_minutes }}
    name: Test Suite (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    if: github.repository == 'brunel-opensim/homepot-client'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            shard: 1
            shard-count: 1
            timeout_minutes: 30
          - os: ubuntu-latest
            python-version: '3.12'
            shard: 1
            shard-count: 1
            timeout_minutes: 30
          - os: windows-latest
            python-version: '3.11'
            shard: 1
            shard-count: 9
            timeout_minutes: 60
          - os: windows-latest
            python-version: '3.11'
            shard: 2
            shard-count: 9
            timeout_minutes: 60
          - os: windows-latest
            python-version: '3.11'
            shard: 3
            shard-count: 9
            timeout_minutes: 60
          - os: windows-latest
            python-version: '3.11'
            shard: 4
            shard-count: 9
            timeout_minutes: 60
          - os: windows-latest
            python-version: '3.11'
            shard: 5
            shard-count: 9
            timeout_minutes: 60
          - os: windows-latest
            python-version: '3.11'
            shard: 6
            shard-count: 9
            timeout_minutes: 60
          - os: windows-latest
            python-version: '3.11'
            shard: 7
            shard-count: 9
            timeout_minutes: 60
          - os: windows-latest
            python-version: '3.11'
            shard: 8
            shard-count: 9
            timeout_minutes: 60
          - os: windows-latest
            python-version: '3.11'
            shard: 9
            shard-count: 9
            timeout_minutes: 60
          - os: macos-latest
            python-version: '3.11'
            shard: 1
            shard-count: 1
            timeout_minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Enable caching for pip

    - name: Install dependencies
      shell: bash
      run: |
        set -e
        python -m pip install --upgrade pip
        PREFER_BINARY="${{ matrix.os == 'windows-latest' && '--prefer-binary' || '' }}"
        pip install ${PREFER_BINARY} -r backend/requirements.txt
        EXTRAS=""
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXTRAS="[agent]"; fi
        pip install ${PREFER_BINARY} -e "backend${EXTRAS}"

    - name: Start PostgreSQL (Ubuntu only, preinstalled on ubuntu-latest)
      if: matrix.os == 'ubuntu-latest'
      timeout-minutes: 5
      run: |
        set -e
        # ubuntu-latest (Ubuntu 24.04) ships PostgreSQL 16 preinstalled but
        # disabled. Starting it avoids a redundant (and flaky) apt-get update,
        # which has repeatedly hung the test job for 15+ minutes.
        sudo systemctl start postgresql.service
        pg_isready -q -h localhost -p 5432 -t 30

    - name: Create CI test role and database
      if: matrix.os == 'ubuntu-latest'
      run: |
        set -e
        sudo -u postgres psql -c "CREATE ROLE ${PG_TEST_USER} LOGIN PASSWORD '${PG_TEST_PASSWORD}';"
        sudo -u postgres psql -c "CREATE DATABASE ${PG_TEST_DB} OWNER ${PG_TEST_USER};"

    - name: Install TimescaleDB extension (Ubuntu only, best-effort)
      if: matrix.os == 'ubuntu-latest'
      continue-on-error: true
      timeout-minutes: 5
      run: |
        curl -s https://packagecloud.io/install/repositories/timescale/timescaledb/script.deb.sh | sudo bash
        sudo apt-get install -y timescaledb-2-postgresql-16
        sudo timescaledb-tune --quiet --yes
        sudo systemctl restart postgresql
        pg_isready
        sudo -u postgres psql -d "${PG_TEST_DB}" -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"

    - name: Verify Alembic migrations apply on PostgreSQL
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      env:
        DATABASE__URL: postgresql://${{ env.PG_TEST_USER }}:${{ env.PG_TEST_PASSWORD }}@localhost:5432/${{ env.PG_TEST_DB_MIG }}
      run: |
        set -e

        # Dedicated scratch database so migration checks never touch the test DB.
        sudo -u postgres psql -c "CREATE DATABASE ${PG_TEST_DB_MIG} OWNER ${PG_TEST_USER};"

        cd backend

        # The app bootstraps the base schema via Base.metadata.create_all at
        # startup; the migration chain is additive on top of it (its root
        # migration ALTERs existing tables rather than creating them).
        # Reproduce that real-world state, roll back to the base revision, then
        # re-apply every migration so the full upgrade path runs on PostgreSQL.
        python - <<'PY'
        import os

        import homepot.database  # noqa: F401  (registers every model with Base.metadata)
        from sqlalchemy import create_engine
        from homepot.models import Base

        engine = create_engine(os.environ["DATABASE__URL"])
        Base.metadata.create_all(engine)
        print("create_all OK")
        PY

        alembic -c alembic.ini stamp head
        alembic -c alembic.ini downgrade base
        alembic -c alembic.ini upgrade head
        alembic -c alembic.ini current

        # The migration-produced schema must match the ORM models for every
        # migration-managed table. This catches migrations that are missing,
        # incomplete, or unguarded against an already-created schema.
        python - <<'PY'
        import os

        from sqlalchemy import create_engine, inspect
        from homepot.models import (
            Device,
            DeviceAssignment,
            DeviceCredential,
            DeviceLifecycleEvent,
            EnrolmentIntent,
            LifecycleEpoch,
            Site,
            SiteMembership,
            Tenant,
            TenantMembership,
            User,
        )

        engine = create_engine(os.environ["DATABASE__URL"])
        inspector = inspect(engine)
        for model in (
            Device,
            Site,
            User,
            Tenant,
            TenantMembership,
            SiteMembership,
            EnrolmentIntent,
            LifecycleEpoch,
            DeviceCredential,
            DeviceAssignment,
            DeviceLifecycleEvent,
        ):
            db_columns = {c["name"] for c in inspector.get_columns(model.__tablename__)}
            missing = set(model.__table__.columns.keys()) - db_columns
            assert not missing, (
                f"{model.__tablename__} is missing columns: {sorted(missing)}"
            )
        print("schema drift check OK")
        PY

        cd ..
        sudo -u postgres psql -c "DROP DATABASE ${PG_TEST_DB_MIG};"

    - name: Run unit tests
      shell: bash
      timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 15 }}
      env:
        DATABASE__URL: ${{ matrix.os == 'ubuntu-latest' && format('postgresql+asyncpg://{0}:{1}@localhost:5432/{2}', env.PG_TEST_USER, env.PG_TEST_PASSWORD, env.PG_TEST_DB) || 'sqlite+aiosqlite:///./test.db' }}
      run: |
        set -o pipefail
        cd backend
        # Windows: the already-sharded jobs run serially (no nested xdist).
        # Nesting `-n auto` inside the sharded Windows jobs intermittently
        # triggers a silent pytest-xdist worker-teardown that exits 1 despite
        # all tests passing. Ubuntu/macOS (single shard, one platform+forked)
        # keep `-n auto` for speed and are stable.
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          # Windows runners are serially sharded by test count (see the
          # TEST_TARGETS split below) so each known-heavy file gets its own
          # shard and no shard approaches the ~45-minute hosted-runner reclaim
          # window. Run pytest serially (no nested xdist; the Windows
          # faulthandler/watchdog diagnostics below rely on a single process).
          XDIST_ARGS="-n 0"
          # Performance/slow/integration tests make real network calls to a
          # localhost backend that is never running in CI, and can hang or
          # produce spurious failures on Windows runners. Exclude them there.
          MARKER_ARGS=(-m "not slow and not integration and not performance")
        else
          XDIST_ARGS="-n auto"
          MARKER_ARGS=()
        fi
        TEST_TARGETS="tests/"

        if [[ "${{ matrix.shard-count }}" -gt 1 ]]; then
          TEST_TARGETS=$(python - "${{ matrix.shard }}" "${{ matrix.shard-count }}" <<'PY'
        from pathlib import Path
        import ast
        import sys

        shard = int(sys.argv[1]) - 1
        shard_count = int(sys.argv[2])

        # Windows-hosted runners are reclaimed by the host after ~45 minutes of
        # sustained load, killing the job with no logs regardless of the job
        # timeout (this is actions/runner-images host behavior). The alphabetical
        # stride split clusters every Windows-expensive test file into one shard,
        # which exceeds that window. Instead assign deterministically by test
        # count: pin the known-heavy files one per shard, then greedily fill the
        # lightest shard, so no shard concentrates a long tail of slow tests.
        HEAVY = {
            "test_agent_command_polling",
            "test_agent_elevation",
            "test_agent_local_ipc",
            "test_homepot_integration",
            "test_local_ipc",
            "test_mqtt_push",
            "test_timescaledb",
            "test_windows_resilience",
            "test_wns_windows",
        }

        def count_tests(path):
            try:
                tree = ast.parse(path.read_text(encoding="utf-8-sig"))
            except Exception:
                raw = path.read_text(encoding="utf-8-sig", errors="replace")
                return sum(
                    1
                    for line in raw.splitlines()
                    if line.lstrip().startswith(("def test_", "async def test_"))
                )
            return sum(
                1
                for node in ast.walk(tree)
                if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                and node.name.startswith("test_")
            )

        test_files = sorted(
            set(Path("tests").rglob("test_*.py"))
            | set(Path("tests").rglob("*_test.py"))
        )
        items = [
            (path.name[:-3], count_tests(path), str(path)) for path in test_files
        ]
        items.sort(key=lambda x: (x[1], x[0]), reverse=True)

        buckets = [[] for _ in range(shard_count)]
        counts = [0] * shard_count
        pinned = 0
        for base, count, path in items:
            if base in HEAVY:
                slot = pinned % shard_count
                buckets[slot].append(path)
                counts[slot] += count
                pinned += 1
        for base, count, path in items:
            if base in HEAVY:
                continue
            slot = min(range(shard_count), key=lambda i: counts[i])
            buckets[slot].append(path)
            counts[slot] += count

        selected = buckets[shard]
        if not selected:
            raise SystemExit(f"No tests assigned to shard {shard + 1}/{shard_count}")
        print(" ".join(selected))
        PY
          )
          echo "Running shard ${{ matrix.shard }}/${{ matrix.shard-count }}: ${TEST_TARGETS}"
        fi

        if [[ "${{ matrix.os }}" == "ubuntu-latest" && "${{ matrix.python-version }}" == "3.11" ]]; then
          # Generate coverage only on Ubuntu 3.11
          pytest ${XDIST_ARGS} ${TEST_TARGETS} "${MARKER_ARGS[@]}" --cov=homepot --cov-report=xml --tb=short --durations=10 \
            -W ignore::UserWarning:homepot \
            -W ignore:".*Database cleanup.*":UserWarning \
            -W ignore:".*Could not cleanup temp database.*":UserWarning
        else
          # Coverage is produced only by Ubuntu 3.11; disable global pyproject coverage elsewhere.
          FAULT_ARGS=()
          VERBOSE_ARGS=()
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows runners have repeatedly black-holed on a hung test and
            # waited out the full 60-minute job timeout with no diagnostics.
            # NOTE: pytest 9.0 moved faulthandler timeout to ini keys, so they
            # are injected via -o (not --faulthandler-* flags). The per-test
            # faulthandler alone is insufficient: a GIL-held C-level hang
            # cannot be dumped by faulthandler, so it never fires. The
            # external file-growth watchdog below (shell level, outside
            # Python) catches those by killing pytest when its log stalls.
            FAULT_ARGS=(-o faulthandler_timeout=300 -o faulthandler_exit_on_timeout=true)
            # Session-level dump for collection/import hangs (written to a
            # file; exit=False so a legitimately slow run is never killed).
            export HOMEPOT_CI_WATCHDOG_SECS=2400
            export HOMEPOT_CI_WATCHDOG_LOG=pytest-watchdog.log
            # Print each test node id as it starts, so the last printed line
            # identifies the hanging test even without a traceback.
            export PYTHONUNBUFFERED=1
            VERBOSE_ARGS=(--verbose)
          fi
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Run pytest in the background and watch its log: if it has not
            # grown for 5 minutes, kill it. This terminates the step on its
            # own (instead of black-holing to the job timeout, which cancels
            # the job and loses subsequent steps), so the artifact-upload step
            # always runs and leaves a diagnosable log behind.
            pytest ${XDIST_ARGS} ${TEST_TARGETS} "${MARKER_ARGS[@]}" "${FAULT_ARGS[@]}" "${VERBOSE_ARGS[@]}" \
              --no-cov --tb=short --durations=10 \
              -W ignore::UserWarning:homepot \
              -W ignore:".*Database cleanup.*":UserWarning \
              -W ignore:".*Could not cleanup temp database.*":UserWarning \
              > pytest-output.log 2>&1 &
            PYTEST_PID=$!
            LAST_SIZE=0
            STALLS=0
            while kill -0 "$PYTEST_PID" 2>/dev/null; do
              sleep 60
              SIZE=0
              if [[ -f pytest-output.log ]]; then
                SIZE=$(wc -c < pytest-output.log)
              fi
              if [[ "$SIZE" -eq "$LAST_SIZE" ]]; then
                STALLS=$((STALLS + 1))
              else
                STALLS=0
              fi
              LAST_SIZE="$SIZE"
              if [[ "$STALLS" -ge 5 ]]; then
                {
                  echo ""
                  echo "=== STALLED: pytest output unchanged for 5 minutes; killing (rc set to failure) ==="
                } >> pytest-output.log
                kill -9 "$PYTEST_PID" 2>/dev/null
                break
              fi
            done
            wait "$PYTEST_PID"
            PYTEST_RC=$?
            if [[ "$STALLS" -ge 5 ]]; then
              echo "--- tail of pytest-output.log ---"
              tail -n 40 pytest-output.log
              PYTEST_RC=1
            fi
            exit "$PYTEST_RC"
          else
            # shellcheck disable=SC2086
            pytest ${XDIST_ARGS} ${TEST_TARGETS} "${MARKER_ARGS[@]}" "${FAULT_ARGS[@]}" --no-cov --tb=short --durations=10 \
              -W ignore::UserWarning:homepot \
              -W ignore:".*Database cleanup.*":UserWarning \
              -W ignore:".*Could not cleanup temp database.*":UserWarning
          fi
        fi

    - name: Upload Windows test logs
      # Preserve the pytest output and any faulthandler/watchdog dumps on
      # Windows, where a hard-exit hang otherwise loses the step log blob.
      if: always() && matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-test-logs-shard-${{ matrix.shard }}
        path: |
          backend/pytest-output.log
          backend/pytest-watchdog.log
        if-no-files-found: ignore

    - name: Run UQ tests
      if: matrix.shard == 1
      shell: bash
      env:
        DATABASE__URL: ${{ matrix.os == 'ubuntu-latest' && format('postgresql+asyncpg://{0}:{1}@localhost:5432/{2}', env.PG_TEST_USER, env.PG_TEST_PASSWORD, env.PG_TEST_DB) || 'sqlite+aiosqlite:///./test.db' }}
      run: |
        cd backend
        if find ../uq/ -name "test_*.py" | grep -q .; then
          echo "Running UQ tests..."
          pytest ../uq/ --tb=short --durations=10
        else
          echo "No UQ tests found, skipping."
        fi

    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella

  build:
    name: Build Package
    runs-on: ubuntu-latest
    if: github.repository == 'brunel-opensim/homepot-client'
    needs: [code-quality, test]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir build wheel

    - name: Build package
      run: |
        cd backend
        python -m build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: backend/dist/
        retention-days: 30

  docker-build:
    timeout-minutes: 25
    name: Docker Build & Test
    runs-on: ubuntu-latest
    if: github.repository == 'brunel-opensim/homepot-client'
    needs: [build]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and test Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: homepot-client:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Test Docker container with PostgreSQL
      run: |
        set -e
        # Start services with Docker Compose V2
        echo "Starting Docker services (PostgreSQL + HOMEPOT)..."
        docker compose up -d
        
        # Check if containers are running
        echo "Checking container status..."
        docker compose ps
        
        # Wait for PostgreSQL to be ready
        echo "Waiting for PostgreSQL to be ready..."
        timeout=60
        elapsed=0
        until docker compose logs postgres | grep -q "database system is ready to accept connections" || [ $elapsed -ge $timeout ]; do
          echo "Waiting for PostgreSQL... ${elapsed}s elapsed"
          sleep 2
          elapsed=$((elapsed + 2))
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "PostgreSQL failed to start within ${timeout}s!"
          docker compose logs postgres
          exit 1
        fi
        
        echo "PostgreSQL is ready!"
        docker compose logs postgres
        
        # Wait for HOMEPOT application to be ready
        echo "Waiting for HOMEPOT application to be ready..."
        sleep 20
        echo "Application logs:"
        docker compose logs homepot-client
        
        # Test health endpoint with retries
        echo "Testing health endpoint..."
        for i in {1..10}; do
          if curl -f http://localhost:8000/health; then
            echo "Health check passed!"
            break
          else
            echo "Health check failed, attempt $i/10, waiting 10s..."
            if [ $i -eq 10 ]; then
              echo "All health check attempts failed!"
              echo "Final application logs:"
              docker compose logs homepot-client
              echo "PostgreSQL logs:"
              docker compose logs postgres
              exit 1
            fi
            sleep 10
          fi
        done
        
        # Test root endpoint
        echo "Testing root endpoint..."
        curl -f http://localhost:8000/ || exit 1
        
        # Cleanup
        echo "Stopping services..."
        docker compose down -v

  notify-consortium:
    name: Notify Consortium Partners
    runs-on: ubuntu-latest
    if: always() && github.repository == 'brunel-opensim/homepot-client'
    needs: [docker-build]
    steps:
    - name: Send deployment notification
      run: echo "HOMEPOT Client CI/CD pipeline completed successfully"
      # Future: Add notification logic here (Slack, email, etc.)
