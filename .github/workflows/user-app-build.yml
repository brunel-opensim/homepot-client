name: User App Build & Package

on:
  push:
    branches: [ main ]
    paths:
      - 'user_app/**'
      - 'packaging/**'
      - 'backend/**'
      - '.github/workflows/user-app-build.yml'
      - '.github/workflows/scripts/frozen-smoke.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'user_app/**'
      - 'packaging/**'
      - 'backend/**'
      - '.github/workflows/user-app-build.yml'
      - '.github/workflows/scripts/frozen-smoke.sh'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish draft release (needed for auto-update on real devices)'
        type: boolean
        required: false
        default: false
      api_base_url:
        description: 'Backend URL baked into the packaged app'
        type: string
        required: false
        default: 'https://homepot.cabera.com/api/v1'

permissions:
  contents: read

env:
  # The renderer has no .env in CI (user_app/.env.local is git-ignored), so
  # without this the bundle falls back to the hardcoded http://localhost:8000
  # and every packaged installer points at the technician's own machine.
  VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://homepot.cabera.com/api/v1' }}

jobs:
  quality:
    name: User App Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: user_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  smoke:
    name: Smoke frozen binaries (${{ matrix.os }})
    needs: [quality]
    runs-on: ${{ matrix.os }}
    # Build the frozen agent + emulator and prove they boot on the build OS
    # on EVERY PR, not just on the post-merge `main` push. The expensive
    # electron-builder packaging stays behind the main-only `package` job,
    # but this cheap PyInstaller + boot smoke is the gate that catches
    # "green on PR, red on merge" regressions like PR #439.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller deps
        run: |
          pip install pyinstaller fastapi uvicorn httpx==0.27.0 psutil platformdirs

      - name: Build frozen agent + emulator (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller ../packaging/agent.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-agent
          python -m PyInstaller ../packaging/emulator.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-emulator

      - name: Smoke-test frozen binaries (must boot on the build OS)
        shell: bash
        run: bash ../.github/workflows/scripts/frozen-smoke.sh "${{ matrix.os }}"

  package:
    name: Package (${{ matrix.os }})
    needs: [quality]
    runs-on: ${{ matrix.os }}
    # Build packages on main pushes (fresh artifacts for testing) and on manual
    # dispatch; do not burn three runners on every PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: '--mac'
          - os: windows-latest
            targets: '--win'
          - os: ubuntu-latest
            targets: '--linux'
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: user_app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install PyInstaller deps
        run: |
          pip install pyinstaller fastapi uvicorn httpx==0.27.0 psutil platformdirs

      - name: Build frozen agent + emulator (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller ../packaging/agent.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-agent
          python -m PyInstaller ../packaging/emulator.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-emulator

      - name: Smoke-test frozen binaries (must boot on the build OS)
        shell: bash
        run: bash ../.github/workflows/scripts/frozen-smoke.sh "${{ matrix.os }}"

      - name: Build renderer + Electron main bundles
        run: npm run build
        env:
          VITE_ELECTRON: 'true'

      - name: Assert the renderer carries a real backend URL
        shell: bash
        run: |
          set -euo pipefail
          # A localhost URL here means the packaged installer would only work
          # on the machine that built it -- fail loudly instead.
          if grep -rq 'localhost:8000' dist/assets/; then
            echo "ERROR: packaged renderer still points at localhost:8000"
            echo "VITE_API_BASE_URL was: '${VITE_API_BASE_URL:-<unset>}'"
            exit 1
          fi
          grep -rhoE 'https?://[a-zA-Z0-9.:_-]+/api/v1' dist/assets/ | sort -u | head -3

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.targets }} --publish never

      - name: Assert packaged app ships the frozen binaries
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-latest)
              app_dir="$(find release -maxdepth 3 -name 'HOMEPOT Agent.app' -type d | head -1)"
              test -n "$app_dir"
              res_dir="$app_dir/Contents/Resources/bin"
              ;;
            windows-latest)
              res_dir="release/win-unpacked/resources/bin"
              ;;
            ubuntu-latest)
              res_dir="release/linux-unpacked/resources/bin"
              ;;
          esac
          test -d "$res_dir/homepot-agent" -a -d "$res_dir/homepot-emulator"
          find "$res_dir" -maxdepth 2 -type f \( -name 'homepot-agent*' -o -name 'homepot-emulator*' \)

      - name: Assert packaged app ships the elevation helper
        shell: bash
        run: |
          set -euo pipefail
          # The "Manage device" grant installs scoped OS elevation from
          # electron/privileged. If these files are missing from the package the
          # grant fails with "Elevation installer not found" on a real device,
          # so fail the build rather than shipping a broken installer.
          case "${{ matrix.os }}" in
            macos-latest)
              app_dir="$(find release -maxdepth 3 -name 'HOMEPOT Agent.app' -type d | head -1)"
              test -n "$app_dir"
              priv_dir="$app_dir/Contents/Resources/user_app/electron/privileged"
              ;;
            windows-latest)
              priv_dir="release/win-unpacked/resources/user_app/electron/privileged"
              ;;
            ubuntu-latest)
              priv_dir="release/linux-unpacked/resources/user_app/electron/privileged"
              ;;
          esac
          test -d "$priv_dir"
          for f in homepot-ctl homepot-ctl.ps1 homepot-ctl-install.ps1 homepot-ctl-install.sh; do
            test -f "$priv_dir/$f" || { echo "missing elevation helper: $priv_dir/$f" >&2; exit 1; }
          done
          find "$priv_dir" -maxdepth 1 -type f

      - name: Assert update feeds reference files that are actually produced
        shell: bash
        run: |
          set -euo pipefail
          # electron-updater builds its download URL from the "url:" field in
          # latest*.yml. If that filename does not match the file we later
          # upload, every installed client 404s on update. Filenames containing
          # spaces are especially dangerous: "gh release upload" rewrites them to
          # dots, silently diverging from the value electron-builder recorded.
          # Each platform emits only its own feed, so glob rather than list
          # literal names: nullglob drops the feeds this OS never produced.
          shopt -s nullglob
          feeds=(release/latest*.yml)
          if [[ ${#feeds[@]} -eq 0 ]]; then
            echo "No latest*.yml produced"; exit 1
          fi
          echo "Feeds to check: ${feeds[*]}"
          status=0
          for feed in "${feeds[@]}"; do
            echo "--- $feed"
            urls=$(grep -E '^[[:space:]]+-?[[:space:]]*url:' "$feed" \
              | sed -E 's/.*url:[[:space:]]*//' | tr -d '"'"'"'')
            for url in $urls; do
              base="$(basename "$url")"
              if [ -z "$(find release -maxdepth 1 -name "$base" -print -quit)" ]; then
                echo "ERROR: $feed references '$base' but no such file was produced"
                status=1
              else
                echo "  ok: $base"
              fi
            done
          done
          exit $status

      - name: Generate checksum manifest for published installers
        shell: bash
        run: |
          set -euo pipefail
          # Technicians verify downloads against this manifest, so it must be
          # built from the exact bytes that get published -- generated here, next
          # to the artifacts, rather than reconstructed later by hand.
          #
          # Two digests per artifact, both from the same read:
          #   sha256 -- what `certutil -hashfile` / `sha256sum` / `shasum -a 256`
          #             print by default, so a technician can reproduce it.
          #   sha512 -- electron-builder's own digest. It is what the updater
          #             verifies against, and it must equal the feed's sha512.
          # The assertion below is the point: if the feed and this manifest ever
          # disagree, the build fails instead of publishing a checksum page that
          # contradicts the auto-updater.
          #
          # Each matrix runner only sees its own platform's artifacts, so it
          # writes a per-OS fragment (checksums.<os>.json). The publish job
          # merges the fragments into the single checksums.json that ships --
          # writing checksums.json here would let the three runners overwrite
          # each other under download-artifact's merge-multiple.
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, sys

          release = pathlib.Path('release')
          manifest = {}

          extensions = ('.exe', '.msi', '.dmg', '.zip', '.AppImage', '.deb', '.rpm')
          for path in sorted(release.iterdir()):
              if not path.is_file() or path.name.endswith('.blockmap'):
                  continue
              if not path.name.endswith(extensions):
                  continue
              data = path.read_bytes()
              manifest[path.name] = {
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'sha512': base64.b64encode(hashlib.sha512(data).digest()).decode(),
              }

          if not manifest:
              sys.exit('ERROR: no installers found to checksum')

          # Cross-check every file the feeds reference: it must have an entry,
          # and the digest must match what the feed advertises.
          status = 0
          for feed in sorted(release.glob('latest*.yml')):
              text = feed.read_text()
              for url, sha512 in re.findall(
                  r'url:\s*(\S+).*?sha512:\s*(\S+)', text, re.DOTALL
              ):
                  url = url.strip('\'"')
                  sha512 = sha512.strip('\'"')
                  entry = manifest.get(url)
                  if entry is None:
                      print(f'ERROR: {feed.name} references {url} with no checksum entry')
                      status = 1
                  elif entry['sha512'] != sha512:
                      print(f'ERROR: {feed.name} sha512 for {url} does not match the file')
                      status = 1
                  else:
                      print(f'  ok: {url} (feed sha512 verified)')
          if status:
              sys.exit(status)

          os_name = os.environ['RUNNER_OS'].lower()
          release.joinpath(f'checksums.{os_name}.json').write_text(
              json.dumps({'files': manifest}, indent=2, sort_keys=True) + '\n'
          )
          print(f'\nchecksums.{os_name}.json: {len(manifest)} artifacts')
          PY

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: user_app/release/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Draft Release
    needs: [package]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true

      - name: Show release files
        run: ls -laR releases

      - name: Merge per-platform checksum fragments
        shell: bash
        run: |
          set -euo pipefail
          # Each package runner wrote checksums.<os>.json for its own artifacts.
          # Combine them into the single checksums.json that the Downloads page
          # and technicians fetch. Fail if a fragment is missing, so a partial
          # manifest is never published as if it were complete.
          python3 - <<'PY'
          import glob, json, pathlib, re, sys

          merged = {}
          fragments = sorted(glob.glob('releases/checksums.*.json'))
          if not fragments:
              sys.exit('ERROR: no checksum fragments found')

          for fragment in fragments:
              data = json.loads(pathlib.Path(fragment).read_text())
              for name, entry in data.get('files', {}).items():
                  if name in merged:
                      sys.exit(f'ERROR: {name} appears in more than one fragment')
                  merged[name] = entry
              print(f'  {fragment}: {len(data.get("files", {}))} artifacts')

          # Every file a feed references must be present, or the page would show
          # a version whose checksum is unknown. Match the same shape the
          # packaging step parses: indented "- url: <file>" entries (plus the
          # top-level "path:" fallback), not an anchored "url:".
          for feed in sorted(glob.glob('releases/latest*.yml')):
              text = pathlib.Path(feed).read_text()
              referenced = set(re.findall(r'(?:^|\s)(?:- )?url:\s*(\S+)', text, re.M))
              path_match = re.search(r'^path:\s*(\S+)', text, re.M)
              if path_match:
                  referenced.add(path_match.group(1))
              for url in sorted(referenced):
                  url = url.strip('\'"')
                  if url not in merged:
                      sys.exit(f'ERROR: {feed} references {url} with no checksum entry')

          pathlib.Path('releases/checksums.json').write_text(
              json.dumps({'files': merged}, indent=2, sort_keys=True) + '\n'
          )
          print(f'checksums.json: {len(merged)} artifacts')
          PY

      - name: Get version from app package
        id: version
        run: echo "APP_VERSION=v$(node -p "require('./user_app/package.json').version")" >> "$GITHUB_OUTPUT"

      # A version number must mean one set of bytes. This release is published
      # (and mirrored to the Downloads page) under the version in
      # user_app/package.json, and the upload below uses --clobber, so a build
      # whose installers differ from what is already published would silently
      # overwrite them: the tag would then describe two different builds.
      #
      # That is exactly the drift this pipeline exists to prevent, and nothing
      # stops it today because a rebuild of an unchanged tree produces
      # byte-identical installers, so re-runs look harmless until the day a
      # change lands without a version bump. Compare the freshly built files
      # against the release's own per-asset digests and refuse to proceed.
      #
      # A re-run of the same tree passes: its digests match. A rebuild after a
      # code change fails until the version is bumped.
      - name: Refuse to republish different bytes under the same version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.APP_VERSION }}"

          # Nothing published under this tag yet: first publish, nothing to
          # compare against.
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "No existing release for ${VERSION}; nothing to compare."
            exit 0
          fi

          # The REST API is used rather than "gh release view --json assets"
          # because only the API surfaces each asset's "digest".
          #
          # Looked up from the release LIST rather than
          # "releases/tags/${VERSION}": the tag endpoint returns 404 for a
          # draft, and drafts are the normal case here, because the publish job
          # creates the release as a draft and this check runs before the
          # upload both when the draft already exists and when it does not.
          RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${VERSION}\")")
          if [ -z "$RELEASE" ]; then
            echo "No existing release for ${VERSION}; nothing to compare."
            exit 0
          fi
          if [ "$(echo "$RELEASE" | jq -r '.assets | length')" -eq 0 ]; then
            echo "Release ${VERSION} has no assets yet; nothing to compare."
            exit 0
          fi

          echo "$RELEASE" | jq -r '.assets[] | "\(.name) \(.digest // "none")"' > /tmp/published.txt

          python3 - <<'PY'
          import hashlib, pathlib, sys

          published = {}
          for line in pathlib.Path('/tmp/published.txt').read_text().splitlines():
              name, _, digest = line.partition(' ')
              if digest.startswith('sha256:'):
                  published[name] = digest.split(':', 1)[1]

          if not published:
              print('No published digests available to compare; skipping.')
              sys.exit(0)

          local = pathlib.Path('releases')
          checked = mismatched = 0
          for path in sorted(local.iterdir()):
              if not path.is_file() or path.name not in published:
                  continue
              h = hashlib.sha256()
              with open(path, 'rb') as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b''):
                      h.update(chunk)
              checked += 1
              if h.hexdigest() != published[path.name]:
                  mismatched += 1
                  print(f'  DIFFERS: {path.name}')
              else:
                  print(f'  same:    {path.name}')

          print(f'\n{checked} asset(s) already published, {mismatched} differing')
          if mismatched:
              print(f'\nERROR: {mismatched} file(s) differ from the bytes already '
                    f'published under this version.\n'
                    f'       The version number is the identity of the bytes: publishing '
                    f'this would\n'
                    f'       make one tag describe two builds, and the Downloads page and '
                    f'updater\n'
                    f'       would disagree about what that version is.\n'
                    f'       Bump the version in user_app/package.json and rebuild.')
              sys.exit(1)
          PY

      - name: Create/update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          # Find an existing draft for this version, otherwise create one.
          # "gh release list" has no --draft flag (only --exclude-drafts), and
          # filtering in --jq keeps this a single call.
          EXISTING=$(gh release list --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"${VERSION}\") | select(.isDraft == true) | .tagName" | head -1)
          if [ -z "$EXISTING" ]; then
            gh release create "${VERSION}" --draft --title "HOMEPOT Agent ${VERSION}" \
              --notes "Packaged HOMEPOT Agent for real-device testing."
          fi
          # Upload the installers, their blockmaps and the update feeds.
          # "gh release upload ./*" also walks the unpacked/ directories and
          # drags in builder-debug.yml, which fails with "is a directory" after
          # the real assets have already landed (leaving a red run over a
          # usable release).
          #
          # The blockmaps ship because electron-updater uses them to build a
          # differential update: without them every update falls back to a full
          # ~130-165 MB download. electron-builder emits them only for the
          # Windows NSIS installer and the macOS zip/dmg, so exactly those three
          # exist -- *.blockmap globs them without having to name them.
          #
          # Note: latest-linux.yml advertises a blockMapSize for the AppImage even
          # though no AppImage blockmap is written. That is upstream
          # electron-builder behaviour, not a missing file, and it is harmless:
          # the updater falls back to a full download. Do not gate on it.
          shopt -s nullglob
          assets=(releases/*.exe releases/*.msi releases/*.dmg releases/*.zip \
                  releases/*.AppImage releases/*.deb releases/*.rpm \
                  releases/*.blockmap \
                  releases/latest.yml releases/latest-mac.yml releases/latest-linux.yml \
                  releases/checksums.json)
          [[ ${#assets[@]} -gt 0 ]] || { echo "No release assets found"; exit 1; }
          printf 'Uploading: %s\n' "${assets[@]}"
          # Refuse to upload names "gh" would rewrite (it turns spaces into dots),
          # which would desynchronise latest*.yml from the real asset names.
          for a in "${assets[@]}"; do
            case "$(basename "$a")" in
              *" "*) echo "ERROR: asset name contains a space: $(basename "$a")"; exit 1 ;;
            esac
          done
          gh release upload "${VERSION}" "${assets[@]}" --clobber
