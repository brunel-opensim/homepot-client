name: User App Build & Package

on:
  push:
    branches: [ main ]
    paths:
      - 'user_app/**'
      - '.github/workflows/user-app-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'user_app/**'
      - '.github/workflows/user-app-build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish draft release (needed for auto-update on real devices)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: User App Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: user_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  package:
    name: Package (${{ matrix.os }})
    needs: [quality]
    runs-on: ${{ matrix.os }}
    # Build packages on main pushes (fresh artifacts for testing) and on manual
    # dispatch; do not burn three runners on every PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: '--mac'
          - os: windows-latest
            targets: '--win'
          - os: ubuntu-latest
            targets: '--linux'
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: user_app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install PyInstaller deps
        run: |
          pip install pyinstaller fastapi uvicorn httpx==0.27.0 psutil platformdirs

      - name: Build frozen agent + emulator (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller ../packaging/agent.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-agent
          python -m PyInstaller ../packaging/emulator.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-emulator

      - name: Smoke-test frozen binaries (must boot on the build OS)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            windows-latest)
              agent=pyinstaller-dist/homepot-agent/homepot-agent.exe
              emulator=pyinstaller-dist/homepot-emulator/homepot-emulator.exe
              ;;
            *)
              agent=pyinstaller-dist/homepot-agent/homepot-agent
              emulator=pyinstaller-dist/homepot-emulator/homepot-emulator
              ;;
          esac
          # The frozen agent's entry point runs the whole runtime loop, so
          # "boots and stays alive" proves the PyInstaller bundle imports the
          # full module graph (agent_api router -> SQLAlchemy etc.) without
          # crashing, not just that a file exists. Killed after the probe.
          "$agent" >/dev/null 2>&1 &
          agent_pid=$!
          sleep 8
          if kill -0 "$agent_pid" 2>/dev/null; then
            kill "$agent_pid" 2>/dev/null || true
            wait "$agent_pid" 2>/dev/null || true
            echo "frozen homepot-agent smoke OK"
          else
            wait "$agent_pid" || true
            echo "homepot-agent exited before the smoke probe finished" >&2
            exit 1
          fi
          # The emulator entry uses argparse, so --help forces the bundled
          # emulator modules to load and exits cleanly.
          "$emulator" --help >/dev/null
          echo "frozen homepot-emulator smoke OK"

      - name: Build renderer + Electron main bundles
        run: npm run build
        env:
          VITE_ELECTRON: 'true'

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.targets }} --publish never

      - name: Assert packaged app ships the frozen binaries
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-latest)
              app_dir="$(find release -maxdepth 3 -name 'HOMEPOT Agent.app' -type d | head -1)"
              test -n "$app_dir"
              res_dir="$app_dir/Contents/Resources/bin"
              ;;
            windows-latest)
              res_dir="release/win-unpacked/resources/bin"
              ;;
            ubuntu-latest)
              res_dir="release/linux-unpacked/resources/bin"
              ;;
          esac
          test -d "$res_dir/homepot-agent" -a -d "$res_dir/homepot-emulator"
          find "$res_dir" -maxdepth 2 -type f \( -name 'homepot-agent*' -o -name 'homepot-emulator*' \)

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: user_app/release/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Draft Release
    needs: [package]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true

      - name: Show release files
        run: ls -laR releases

      - name: Get version from app package
        id: version
        run: echo "APP_VERSION=v$(node -p "require('./user_app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create/update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          # Find an existing draft for this version, otherwise create one.
          DRAFT_URL=$(gh release list --draft --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"${VERSION}\") | select(.isDraft == true) | .tagName" | head -1)
          if [ -z "$DRAFT_URL" ]; then
            gh release create "${VERSION}" --draft --title "HOMEPOT Agent ${VERSION}" \
              --notes "Packaged HOMEPOT Agent for real-device testing." >/dev/null
          fi
          cd releases
          gh release upload "${VERSION}" ./* --clobber
