name: User App Build & Package

on:
  push:
    branches: [ main ]
    paths:
      - 'user_app/**'
      - 'packaging/**'
      - 'backend/**'
      - '.github/workflows/user-app-build.yml'
      - '.github/workflows/scripts/frozen-smoke.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'user_app/**'
      - 'packaging/**'
      - 'backend/**'
      - '.github/workflows/user-app-build.yml'
      - '.github/workflows/scripts/frozen-smoke.sh'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish draft release (needed for auto-update on real devices)'
        type: boolean
        required: false
        default: false
      api_base_url:
        description: 'Backend URL baked into the packaged app'
        type: string
        required: false
        default: 'https://homepot.cabera.com/api/v1'

permissions:
  contents: read

env:
  # The renderer has no .env in CI (user_app/.env.local is git-ignored), so
  # without this the bundle falls back to the hardcoded http://localhost:8000
  # and every packaged installer points at the technician's own machine.
  VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://homepot.cabera.com/api/v1' }}

jobs:
  quality:
    name: User App Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: user_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  smoke:
    name: Smoke frozen binaries (${{ matrix.os }})
    needs: [quality]
    runs-on: ${{ matrix.os }}
    # Build the frozen agent + emulator and prove they boot on the build OS
    # on EVERY PR, not just on the post-merge `main` push. The expensive
    # electron-builder packaging stays behind the main-only `package` job,
    # but this cheap PyInstaller + boot smoke is the gate that catches
    # "green on PR, red on merge" regressions like PR #439.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller deps
        run: |
          pip install pyinstaller fastapi uvicorn httpx==0.27.0 psutil platformdirs

      - name: Build frozen agent + emulator (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller ../packaging/agent.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-agent
          python -m PyInstaller ../packaging/emulator.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-emulator

      - name: Smoke-test frozen binaries (must boot on the build OS)
        shell: bash
        run: bash ../.github/workflows/scripts/frozen-smoke.sh "${{ matrix.os }}"

  package:
    name: Package (${{ matrix.os }})
    needs: [quality]
    runs-on: ${{ matrix.os }}
    # Build packages on main pushes (fresh artifacts for testing) and on manual
    # dispatch; do not burn three runners on every PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: '--mac'
          - os: windows-latest
            targets: '--win'
          - os: ubuntu-latest
            targets: '--linux'
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: user_app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install PyInstaller deps
        run: |
          pip install pyinstaller fastapi uvicorn httpx==0.27.0 psutil platformdirs

      - name: Build frozen agent + emulator (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller ../packaging/agent.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-agent
          python -m PyInstaller ../packaging/emulator.spec \
            --distpath pyinstaller-dist --workpath /tmp/pyinstaller-emulator

      - name: Smoke-test frozen binaries (must boot on the build OS)
        shell: bash
        run: bash ../.github/workflows/scripts/frozen-smoke.sh "${{ matrix.os }}"

      - name: Build renderer + Electron main bundles
        run: npm run build
        env:
          VITE_ELECTRON: 'true'

      - name: Assert the renderer carries a real backend URL
        shell: bash
        run: |
          set -euo pipefail
          # A localhost URL here means the packaged installer would only work
          # on the machine that built it -- fail loudly instead.
          if grep -rq 'localhost:8000' dist/assets/; then
            echo "ERROR: packaged renderer still points at localhost:8000"
            echo "VITE_API_BASE_URL was: '${VITE_API_BASE_URL:-<unset>}'"
            exit 1
          fi
          grep -rhoE 'https?://[a-zA-Z0-9.:_-]+/api/v1' dist/assets/ | sort -u | head -3

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.targets }} --publish never

      - name: Assert packaged app ships the frozen binaries
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-latest)
              app_dir="$(find release -maxdepth 3 -name 'HOMEPOT Agent.app' -type d | head -1)"
              test -n "$app_dir"
              res_dir="$app_dir/Contents/Resources/bin"
              ;;
            windows-latest)
              res_dir="release/win-unpacked/resources/bin"
              ;;
            ubuntu-latest)
              res_dir="release/linux-unpacked/resources/bin"
              ;;
          esac
          test -d "$res_dir/homepot-agent" -a -d "$res_dir/homepot-emulator"
          find "$res_dir" -maxdepth 2 -type f \( -name 'homepot-agent*' -o -name 'homepot-emulator*' \)

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: user_app/release/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Draft Release
    needs: [package]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true

      - name: Show release files
        run: ls -laR releases

      - name: Get version from app package
        id: version
        run: echo "APP_VERSION=v$(node -p "require('./user_app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create/update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          # Find an existing draft for this version, otherwise create one.
          # "gh release list" has no --draft flag (only --exclude-drafts), and
          # filtering in --jq keeps this a single call.
          EXISTING=$(gh release list --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"${VERSION}\") | select(.isDraft == true) | .tagName" | head -1)
          if [ -z "$EXISTING" ]; then
            gh release create "${VERSION}" --draft --title "HOMEPOT Agent ${VERSION}" \
              --notes "Packaged HOMEPOT Agent for real-device testing."
          fi
          # Upload only the installers and update feeds. "gh release upload ./*"
          # also walks the unpacked/ directories and drags in builder-debug.yml,
          # which fails with "is a directory" after the real assets have already
          # landed (leaving a red run over a usable release).
          shopt -s nullglob
          assets=(releases/*.exe releases/*.msi releases/*.dmg releases/*.zip \
                  releases/*.AppImage releases/*.deb releases/*.rpm \
                  releases/latest.yml releases/latest-mac.yml releases/latest-linux.yml)
          [[ ${#assets[@]} -gt 0 ]] || { echo "No release assets found"; exit 1; }
          printf 'Uploading: %s\n' "${assets[@]}"
          gh release upload "${VERSION}" "${assets[@]}" --clobber
