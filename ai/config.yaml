app:
  name: "System Diagnostics AI"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8001

llm:
  # The active model is read here. A 4 GiB GPU like the Quadro P620 tops out
  # around 4B parameters at Q4; qwen3:4b is a valid alternative but runs its
  # (non-disableable) thinking mode, making each request several minutes long.
  # See README section "Switching LLM Models Locally" for sizing guidance and
  # measured data.
  model: "llama3.2"
  base_url: "http://localhost:11434"
  temperature: 0.7
  # The static system prompt is ~3.8k tokens; the request also appends live
  # status to the user turn. 4096 left no room (Ollama truncates the prompt,
  # which can evict instructions), so keep 8192 for headroom.
  context_window: 8192
  # Cap generated tokens per answer. CPU generation runs at ~4 tok/s, so
  # output length dominates latency. 160 lets the common "system status"
  # answer (~110-140 tokens) finish rather than being cut mid-list, while
  # still bounding the worst case (~37s of generation; see
  # docs/server-deployment.md). Answers longer than this end with "…".
  num_predict: 160
  # How long Ollama keeps the model resident after a request (Ollama's own
  # default is 5m). A long value avoids the cold-load cost on sparse queries.
  keep_alive: "30m"

# Long-term AI memory (ChromaDB vector store) -- see docs/ai-memory.md.
#
# Memories are scoped (user/site/device) and recalled by semantic similarity.
# Changing `distance_metric` after the collection exists has no effect until the
# collection is recreated (delete `chroma_path`), and `max_distance` is only
# meaningful for the metric the collection was built with.
memory:
  chroma_path: "data/chroma_db"
  collection_name: "device_logs"
  embedding_model: "all-MiniLM-L6-v2"   # informational; ChromaDB's default embedder
  distance_metric: "cosine"             # "cosine" (0..2) or "l2"
  n_results: 5                          # max memories recalled per query
  # Relevance cutoff on the vector distance (lower = more similar). Memories
  # farther than this are not injected. Set to null to disable the cutoff and
  # always return the top `n_results`.
  max_distance: 0.9
  retention_days: 90                    # prune memories older than this (null = keep forever)
  answer_digest_chars: 500              # how much of each answer to store
  write_on_query: true                  # persist a compact memory after each AI answer

database:
  # Use PostgreSQL from docker-compose
  url: "postgresql://homepot_user:homepot_dev_password@localhost:5432/homepot_db"
  # url: "sqlite:///homepot.db"

# Anomaly detection for device telemetry (ai/anomaly_detection.py).
#
# The detector is rule-based: each metric that crosses its threshold adds a
# weighted contribution to an anomaly score (0.0-1.0). Higher-impact signals
# (flapping, consecutive failures) carry more weight than resource usage.
# Thresholds below are the values at which a metric is flagged as anomalous.
#
# `sensitivity` scales the final anomaly score (score * sensitivity, capped at
# 1.0) -- lower values report a smaller score for the same raw signal. It does
# not change which thresholds fire, only the reported score.
# `window_size` is a reserved key and is not currently applied by the detector.
anomaly_detection:
  sensitivity: 0.8
  window_size: 50
  thresholds:
    network_latency_ms: 200          # ms; above this flags "High Latency"
    cpu_percent: 90.0                # %; above this flags "High CPU"
    memory_percent: 90.0             # %; above this flags "High Memory"
    disk_percent: 90.0               # %; above this flags "High Disk Usage"
    error_rate: 0.05                 # ratio (5%); above this flags "High Error Rate"
    max_flapping_count: 5            # state changes per hour; above this flags "High Instability"
    consecutive_failures: 3          # health-check failures in a row; at/above this flags "System Failure"

# Validation-gate thresholds for the AI trust envelope (ai/gates/*).
#
# This is the single source of truth for tunable gate behaviour. The in-code
# DEFAULT_* constants (ai/gates/gate_b.py, gate_c.py) are used only as a
# fallback when a key is missing here, so change thresholds in THIS file, not
# in code.
#
# TESTING NOTE: continuity_gap_seconds and completeness_max_null_ratio are
# deliberately relaxed for the current development/testing phase so Gate B
# passes on rehearsal data and the downstream gates (C/D/E) can be exercised.
# Restore the paper's values (continuity <= 60s, null ratio 0) for real-device
# testing so Gate B rejects stale/incomplete telemetry.
validation_gates:
  gate_b:
    freshness_max_age_seconds: 300   # 5-minute heartbeat baseline
    continuity_gap_seconds: 1800     # TESTING: relaxed 30 min (paper: 60s)
    sustained_gap_seconds: 3600      # "gaps > 60 min"
    completeness_max_null_ratio: 0.01  # TESTING: allow up to 1% nulls (real: 0)
  gate_c:
    required_blocks:
      - "[CURRENT SYSTEM STATUS]"
    max_context_chars: 16000          # ~4k tokens at 4 chars/token heuristic
