app:
  name: "System Diagnostics AI"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8001

llm:
  # Provider selection: "ollama" (local), "openai", or "anthropic".
  # For demo sessions with limited server resources, use "openai" or
  # "anthropic" for faster responses. For production with real devices,
  # use "ollama" for data privacy.
  # NOTE: a runtime preference in ai/provider.json overrides this value (see
  # ai/provider.py). The Dashboard provider dropdown writes that file.
  provider: "ollama"

  # The active model is read here. A 4 GiB GPU like the Quadro P620 tops out
  # around 4B parameters at Q4; qwen3:4b is a valid alternative but runs its
  # (non-disableable) thinking mode, making each request several minutes long.
  # See README section "Switching LLM Models Locally" for sizing guidance and
  # measured data.
  model: "llama3.2"

  # External provider settings (used when provider is "openai" or "anthropic").
  # API keys are read from environment variables, not stored here.
  external:
    # Per-provider overrides. Any key omitted here falls back to the shared
    # top-level value above, so Ollama and the cloud providers start from the
    # same baseline (fair comparison). Raise these for external providers to
    # unlock their larger windows / faster inference.
    openai:
      model: "gpt-4o-mini"
      api_key_env: "OPENAI_API_KEY"
      base_url: "https://api.openai.com/v1"
      # context_budget: 6000   # chars of enriched context (default 2000)
      # num_predict: 512       # output token cap (default 120)
      # max_concurrent: 4      # concurrency (default 1)
      # memory_n_results: 5    # recalled memories (default 3)
    anthropic:
      model: "claude-haiku-4-5-20251001"
      api_key_env: "ANTHROPIC_API_KEY"
      base_url: "https://api.anthropic.com"
      # context_budget: 6000
      # num_predict: 512
      # max_concurrent: 4
      # memory_n_results: 5
  base_url: "http://localhost:11434"
  temperature: 0.7
  # The static system prompt is ~3.8k tokens; the request also appends live
  # status to the user turn. 4096 left no room (Ollama truncates the prompt,
  # which can evict instructions), so keep 8192 for headroom.
  context_window: 8192
  # Max characters of enriched diagnostic context (the 20+ ContextBuilder
  # blocks) appended to the prompt. Caps context size so small-window models
  # (Ollama, num_ctx=8192) are not overwhelmed; raise for cloud providers
  # with large windows. Same context building for all; only the amount fed
  # in is configurable. 0 = no cap.
  context_budget: 4000
  # Cap generated tokens per answer. CPU generation runs at ~4 tok/s, so
  # output length dominates latency. 160 lets the common "system status"
  # answer (~110-140 tokens) finish rather than being cut mid-list, while
  # still bounding the worst case (~37s of generation; see
  # docs/server-deployment.md). Answers longer than this end with "…".
  num_predict: 120  # reduced from 160 for latency
  # How long Ollama keeps the model resident after a request (Ollama's own
  # default is 5m). A long value avoids the cold-load cost on sparse queries.
  # Ollama-only; ignored by external providers.
  keep_alive: "30m"
  # Application-level concurrency gate (see docs/ai-concurrency.md). Ollama
  # serves generations through a small number of inference slots
  # (OLLAMA_NUM_PARALLEL; unset => a single slot), so concurrent answers queue
  # there invisibly. `max_concurrent` caps how many generations the backend runs
  # at once (keep aligned with Ollama's slot count) and `queue_timeout_seconds`
  # bounds how long a request waits for a slot before the API returns HTTP 503
  # ("busy") instead of hanging. Set to 0/omit to wait indefinitely.
  # 120s (not 45s) because an abandoned query -- Stop/Esc -- keeps the slot busy
  # until its generation ends, so a retry should wait for the slot rather than
  # collect a 503 (see docs/ai-concurrency.md, "Cancelling a query").
  max_concurrent: 1
  queue_timeout_seconds: 120

# Long-term AI memory (ChromaDB vector store) -- see docs/ai-memory.md.
#
# Memories are scoped (user/site/device) and recalled by semantic similarity.
# Changing `distance_metric` after the collection exists has no effect until the
# collection is recreated (delete `chroma_path`), and `max_distance` is only
# meaningful for the metric the collection was built with.
memory:
  chroma_path: "data/chroma_db"
  collection_name: "device_logs"
  embedding_model: "all-MiniLM-L6-v2"   # informational; ChromaDB's default embedder
  distance_metric: "cosine"             # "cosine" (0..2) or "l2"
  n_results: 3                          # max memories recalled per query (reduced for latency)
  # Relevance cutoff on the vector distance (lower = more similar). Memories
  # farther than this are not injected. Set to null to disable the cutoff and
  # always return the top `n_results`.
  max_distance: 0.9
  retention_days: 90                    # prune memories older than this (null = keep forever)
  answer_digest_chars: 500              # how much of each answer to store
  write_on_query: true                  # persist a compact memory after each AI answer

# Documentation retrieval (Tier C grounding; ai/doc_retriever.py).
#
# The knowledge path answers how-to/definition questions from documentation.
# This vector index covers the whole `docs/*.md` corpus so answers can cite
# real file paths instead of a fixed five-doc excerpt list (which left common
# topics like device enrolment unsourced, so the model invented file names).
#
# `n_results` caps how many chunks are injected per query; `max_distance` is a
# relevance cutoff on the vector distance (lower = closer, `null` disables it).
# Chunking is heading-aware; long sections are split into `chunk_size`
# windows with `chunk_overlap` characters of overlap. The index rebuilds only
# when a doc's path/size/mtime changes (see DocRetriever._index_version), so a
# stable corpus costs nothing per query.
docs:
  chroma_path: "data/docs_chroma"
  collection_name: "project_docs"
  distance_metric: "cosine"             # "cosine" (0..2) or "l2"
  # Retrieval size is per-query latency: the injected [RELEVANT DOCUMENTATION]
  # block is part of the *user* turn, which Ollama re-evaluates on every request
  # (the system prompt is prefix-cached; the user turn is not) at ~25-35 tok/s
  # on the CPU demo host. 6 x 1200 injected ~2,950 chars (~740 tokens, ~25s) per
  # query; 4 x 800 injects ~1,730 (~430 tokens) and measured ~17-22s less prompt
  # eval live. Fewer chunks does make "list everything" answers less exhaustive
  # - see docs/ai-doc-retrieval.md ("Cost").
  n_results: 3                          # max doc chunks injected per query (reduced for latency)
  # Cosine distance for a relevant MiniLM match is typically <0.9; unrelated
  # chunks sit near 1.0. Raise toward 1.0 to widen recall, lower to tighten.
  max_distance: 0.9
  # Long sections are split into `chunk_size` windows with `chunk_overlap`
  # characters of overlap. Smaller chunks cost fewer tokens each and embed more
  # precisely, and together with `n_results` they bound the block above.
  # Changing any indexing setting rebuilds the index (see _index_version).
  chunk_size: 600                       # characters per chunk (~150 tokens, reduced for latency)
  chunk_overlap: 150                    # overlap between split windows
  max_chunks_per_doc: 40                # bound one doc's contribution (reduced for latency)
  max_file_bytes: 2000000               # skip unreasonably large files

# Read-only repository access for the AI (Tier B grounding; ai/repo_tools.py).
#
# The knowledge and agentic paths may read the project's own documentation and
# code on demand via allowlisted, bounded, read-only tools (read_file,
# search_code, list_dir). Unlike the docs: index above, these read the *live*
# files (always current, exact path:line) and store no copy.
#
# DISABLED by default: the tools are only offered when `enabled` is true (or
# the AI_CODE_ACCESS env var is truthy). Paths are resolved with realpath, so
# `..` traversal, absolute paths and symlink escapes are rejected; `deny` globs
# block secret material even inside a root. See docs/ai-code-access.md.
code_access:
  enabled: false
  roots:                                # only these trees are readable
    - "docs/"
    - "backend/src/"
    - "ai/"
    - "frontend/src/"
  deny:                                 # refused even inside a root
    - ".env"
    - ".env.*"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.pfx"
    - "id_rsa*"
    - "id_ed25519*"
    - "*credentials*"
    - "*secret*"
  max_read_lines: 400                   # lines per read_file
  max_hits: 20                          # matches per search_code
  max_entries: 200                      # entries per list_dir
  max_bytes_per_call: 65536             # byte cap on one tool result
  max_tool_calls: 6                     # per-run tool-call budget
  max_tool_bytes: 262144                # per-run tool-result byte budget
  max_file_bytes: 2000000               # skip files larger than this

database:
  # Use PostgreSQL from docker-compose
  url: "postgresql://homepot_user:homepot_dev_password@localhost:5432/homepot_db"
  # url: "sqlite:///homepot.db"

# Anomaly detection for device telemetry (ai/anomaly_detection.py).
#
# The detector is rule-based: each metric that crosses its threshold adds a
# weighted contribution to an anomaly score (0.0-1.0). Higher-impact signals
# (flapping, consecutive failures) carry more weight than resource usage.
# Thresholds below are the values at which a metric is flagged as anomalous.
#
# `sensitivity` scales the final anomaly score (score * sensitivity, capped at
# 1.0) -- lower values report a smaller score for the same raw signal. It does
# not change which thresholds fire, only the reported score.
# `window_size` is a reserved key and is not currently applied by the detector.
anomaly_detection:
  sensitivity: 0.8
  window_size: 50
  thresholds:
    network_latency_ms: 200          # ms; above this flags "High Latency"
    cpu_percent: 90.0                # %; above this flags "High CPU"
    memory_percent: 90.0             # %; above this flags "High Memory"
    disk_percent: 90.0               # %; above this flags "High Disk Usage"
    error_rate: 0.05                 # ratio (5%); above this flags "High Error Rate"
    max_flapping_count: 5            # state changes per hour; above this flags "High Instability"
    consecutive_failures: 3          # health-check failures in a row; at/above this flags "System Failure"

# Validation-gate thresholds for the AI trust envelope (ai/gates/*).
#
# This is the single source of truth for tunable gate behaviour. The in-code
# DEFAULT_* constants (ai/gates/gate_b.py, gate_c.py) are used only as a
# fallback when a key is missing here, so change thresholds in THIS file, not
# in code.
#
# TESTING NOTE: continuity_gap_seconds and completeness_max_null_ratio are
# deliberately relaxed for the current development/testing phase so Gate B
# passes on rehearsal data and the downstream gates (C/D/E) can be exercised.
# Restore the paper's values (continuity <= 60s, null ratio 0) for real-device
# testing so Gate B rejects stale/incomplete telemetry.
validation_gates:
  gate_b:
    freshness_max_age_seconds: 300   # 5-minute heartbeat baseline
    continuity_gap_seconds: 1800     # TESTING: relaxed 30 min (paper: 60s)
    sustained_gap_seconds: 3600      # "gaps > 60 min"
    completeness_max_null_ratio: 0.01  # TESTING: allow up to 1% nulls (real: 0)
  gate_c:
    required_blocks:
      - "[CURRENT SYSTEM STATUS]"
    max_context_chars: 16000          # ~4k tokens at 4 chars/token heuristic
